name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, develop, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.filter.outputs.db }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            db:
              - 'backend/**'
              - 'migrations/**'
              - 'tests/db/**'
              - 'packages/contracts/**'
              - 'scripts/test-db*'
              - 'scripts/verify*'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'vitest.db.config.ts'
              - '.github/workflows/ci.yml'
            browser:
              - 'frontend/**'
              - 'backend/**'
              - 'packages/contracts/**'
              - 'packages/analytics/**'
              - 'tests/e2e/**'
              - 'scripts/check-bundle*'
              - 'scripts/verify*'
              - 'playwright.config.ts'
              - 'playwright.posthog.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: pnpm install --frozen-lockfile
      - name: Code quality and unit tests
        run: pnpm verify lint typecheck test
      - name: Python processing tests and package
        run: |
          python3 -m venv "$RUNNER_TEMP/peekaplate-uv"
          "$RUNNER_TEMP/peekaplate-uv/bin/pip" install --disable-pip-version-check uv==0.12.10
          "$RUNNER_TEMP/peekaplate-uv/bin/uv" sync --project processing --extra service --frozen
          "$RUNNER_TEMP/peekaplate-uv/bin/uv" run --project processing --extra service --frozen python -m unittest discover -s processing/tests
          "$RUNNER_TEMP/peekaplate-uv/bin/uv" build --project processing
      - run: pnpm verify build
      - name: Context freshness
        if: ${{ !cancelled() }}
        run: pnpm verify context:check
      - name: Documentation links
        if: ${{ !cancelled() }}
        run: pnpm verify docs:check
      - name: PR documentation
        if: ${{ !cancelled() }}
        run: pnpm verify pr:check

  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify test:db

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify test:e2e

  ci:
    if: always()
    needs: [changes, quality, database, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every applicable check
        env:
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          DATABASE: ${{ needs.database.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$CHANGES" = success
          test "$QUALITY" = success
          test "$DATABASE" = success -o "$DATABASE" = skipped
          test "$BROWSER" = success -o "$BROWSER" = skipped
