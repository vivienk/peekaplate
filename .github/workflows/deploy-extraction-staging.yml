name: Deploy staging extraction

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed main commit SHA to deploy to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOYMENT_APPROVED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    steps:
      - name: Check reviewed revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy paired extraction host and container
        working-directory: backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = '51eda1917fd22a9478808a82d2980741'
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm exec wrangler deploy --config wrangler.extraction.jsonc
